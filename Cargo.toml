[package]
name = "vimify"
version = "0.1.0"
edition = "2024"
description = "One vim-style keymap and theme for your CLI and TUI tools"
repository = "https://github.com/ike-forge/vimify"
homepage = "https://github.com/ike-forge/vimify"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7"
ratatui = "0.30"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
toml = "1.1.8"
toml_edit = "0.25"
yaml-edit = "0.3.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dist]
inherits = "release"

# `publish = false` makes dist skip the package.
[package.metadata.dist]
dist = true
