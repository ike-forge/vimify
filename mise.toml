[tools]
rust = { version = "1.99.0", components = "clippy,rustfmt" }
kind = "0.33.0"

[tasks.build]
run = "cargo build --release"

[tasks.install]
description = "Build the release binary and link it into ~/.local/bin as `vimify-local`, alongside the brew binary"
run = "cargo build --release && mkdir -p ~/.local/bin && ln -sf $PWD/target/release/vimify ~/.local/bin/vimify-local"

[tasks.run]
run = "cargo run --"

[tasks.test]
run = "cargo test"

[tasks.lint]
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings"]

[tasks.screenshots]
run = "bash scripts/screenshots/capture.sh"

[tasks.fmt]
run = "cargo fmt"

# Host CAs are passed in for TLS-intercepting proxies (e.g. Zscaler).
[tasks."sandbox:build"]
run = """
ca=${VIMIFY_EXTRA_CA_DIR:-/usr/local/share/ca-certificates}
set --
[ -d "$ca" ] && set -- --build-context "extra-ca=$ca"
docker build "$@" -f docker/Dockerfile -t vimify-sandbox .
"""

# Fresh container each run: no state carries over. The host Docker socket is
# mounted for lazydocker, which gives the container control of host Docker.
[tasks.sandbox]
depends = ["sandbox:build", "sandbox:cluster", "sandbox:s3"]
run = """
set --
sock=/var/run/docker.sock
[ -S "$sock" ] && set -- -v "$sock:$sock" --group-add "$(stat -c %g "$sock" 2>/dev/null || stat -f %g "$sock")"
# Repeated --network needs Docker 25+.
docker run --rm -it "$@" \
  --network kind -e SANDBOX_KUBECONFIG="$(kind get kubeconfig --internal --name vimify)" \
  --network vimify-s3 -e SANDBOX_S3=http://vimify-s3:9000 \
  vimify-sandbox
"""

[tasks.e2e]
depends = ["sandbox:build"]
run = "docker run --rm vimify-sandbox sandbox-e2e"

# Pulls a ~1GB node image once and keeps a cluster running on host Docker.
[tasks."sandbox:cluster"]
run = """
if ! kind get clusters 2>/dev/null | grep -qx vimify; then
  # Keeps the cluster out of the host ~/.kube/config.
  cfg=$(mktemp)
  kind create cluster --name vimify --kubeconfig "$cfg"
  rm -f "$cfg"
fi
# Stopped after a host or Docker restart.
docker start vimify-control-plane >/dev/null
# Pulled by host Docker: the node's containerd lacks the proxy CAs. Not `kind
# load`: it imports all platforms, but the containerd image store holds only one.
for img in $(sed -n 's/^ *image: *//p' docker/cluster.yaml | sort -u); do
  docker pull -q "$img" >/dev/null
  docker save "$img" | docker exec -i vimify-control-plane ctr -n k8s.io images import - >/dev/null
done
# The node's own kubectl, so the host needs none.
k() { docker exec -i vimify-control-plane kubectl --kubeconfig /etc/kubernetes/admin.conf "$@"; }
i=0
until k get --raw /readyz >/dev/null 2>&1; do
  i=$((i + 1)); [ "$i" -lt 60 ] || { echo "kind API not ready" >&2; exit 1; }; sleep 1
done
k apply -f - < docker/cluster.yaml
"""

[tasks."sandbox:cluster:delete"]
run = "kind delete cluster --name vimify"

# S3 server for stu. RustFS, not MinIO: MinIO no longer publishes images.
# Credentials are repeated in docker/entrypoint.sh.
[tasks."sandbox:s3"]
run = """
docker network inspect vimify-s3 >/dev/null 2>&1 || docker network create vimify-s3 >/dev/null
if ! docker container inspect vimify-s3 >/dev/null 2>&1; then
  docker run -d --name vimify-s3 --network vimify-s3 -p 127.0.0.1:9001:9001 \
    -e RUSTFS_ACCESS_KEY=sandbox -e RUSTFS_SECRET_KEY=sandbox-secret \
    -e RUSTFS_CONSOLE_ENABLE=true rustfs/rustfs:1.0.4 >/dev/null
fi
docker start vimify-s3 >/dev/null
docker run --rm -i --network vimify-s3 \
  -e AWS_ACCESS_KEY_ID=sandbox -e AWS_SECRET_ACCESS_KEY=sandbox-secret \
  -e AWS_REGION=us-east-1 -e S3_ENDPOINT=http://vimify-s3:9000 \
  --entrypoint sh amazon/aws-cli:2.39.6 -s < docker/s3-seed.sh
echo "console: http://127.0.0.1:9001 (sandbox / sandbox-secret)"
"""

[tasks."sandbox:s3:delete"]
run = "docker rm -f vimify-s3 >/dev/null 2>&1; docker network rm vimify-s3 >/dev/null 2>&1; true"
