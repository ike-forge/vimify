schema = 1
version = "0.4.0"
binaries = ["yazi"]
versions = ">=26.9"

notes = "top stays on gg: g is yazi's goto prefix. help is not mapped: ? is find previous, as in vim. Keys cover the file list only; the task, preview and input layers keep their own. A keymap written as [[mgr.prepend_keymap]] tables is refused: use the inline array. theme.toml is replaced whole. The Catppuccin theme points preview highlighting at ~/.config/yazi/Catppuccin-<flavour>.tmTheme, which vimify does not write."

# prepend_keymap, not keymap: that replaces yazi's defaults, which must keep working.
[[target]]
format = "toml"
strategy = "edit"
key_notation = "vim"
paths = ["$YAZI_CONFIG_HOME/keymap.toml", "$XDG_CONFIG_HOME/yazi/keymap.toml"]

[target.keys]
"mgr.prepend_keymap[run=arrow prev].on" = "up"
"mgr.prepend_keymap[run=arrow next].on" = "down"
"mgr.prepend_keymap[run=leave].on" = "left"
"mgr.prepend_keymap[run=enter].on" = "right"
"mgr.prepend_keymap[run=yank].on" = "yank"
"mgr.prepend_keymap[run=remove].on" = "delete"
"mgr.prepend_keymap[run=quit].on" = "quit"
"mgr.prepend_keymap[run=arrow bot].on" = "bottom"
"mgr.prepend_keymap[run=arrow -50%].on" = "page_up"
"mgr.prepend_keymap[run=arrow 50%].on" = "page_down"
"mgr.prepend_keymap[run=find --smart].on" = "search"

[[target]]
format = "toml"
strategy = "file"
paths = ["$YAZI_CONFIG_HOME/theme.toml", "$XDG_CONFIG_HOME/yazi/theme.toml"]
template = '''
[mgr]
cwd = { fg = "{accent}" }
border_style = { fg = "{border}" }

[tabs]
active = { fg = "{base}", bg = "{accent}" }
inactive = { fg = "{accent}", bg = "{selection}" }

[mode]
normal_main = { fg = "{base}", bg = "{accent}" }
normal_alt = { fg = "{accent}", bg = "{selection}" }

[indicator]
current = { fg = "{text}", bg = "{selection}" }'''

[target.upstream]
catppuccin-latte = "themes/latte/catppuccin-latte-{accent}.toml"
catppuccin-frappe = "themes/frappe/catppuccin-frappe-{accent}.toml"
catppuccin-macchiato = "themes/macchiato/catppuccin-macchiato-{accent}.toml"
catppuccin-mocha = "themes/mocha/catppuccin-mocha-{accent}.toml"
