# Mine
[mgr]
prepend_keymap = [
	{ on = "x", run = "mine", desc = "Mine" },
	{ run = "arrow next", on = "j" },
	{ run = "arrow prev", on = "k" },
	{ run = "enter", on = "l" },
	{ run = "leave", on = "h" },
	{ run = "quit", on = "q" },
	{ run = "remove", on = "d" },
	{ run = "yank", on = "y" },
]

[tasks]
prepend_keymap = [{ on = "q", run = "close" }]
