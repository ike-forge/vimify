schema = 1
version = "0.3.0"
# Debian and Ubuntu ship the binary as batcat.
binaries = ["bat", "batcat"]
versions = ">=0.25"
# bat reads themes from its cache, not from themes/.
refresh_args = ["cache", "--build"]

notes = "Theme only: bat has no keybindings. Output longer than a screen pages through less, so its keys are less's. The less port rebinds them. Writes the palette as a vimify syntax theme and selects it, replacing any `--theme` in the config. Rebuilds bat's cache after apply and revert, which also picks up other themes and syntaxes in bat's config directory."

[[target]]
format = "args"
strategy = "edit"
paths = ["$BAT_CONFIG_PATH", "$XDG_CONFIG_HOME/bat/config"]

[target.theme]
"--theme" = '"vimify"'

[[target]]
format = "xml"
strategy = "file"
paths = ["$BAT_CONFIG_DIR/themes/vimify.tmTheme", "$XDG_CONFIG_HOME/bat/themes/vimify.tmTheme"]
template = '''
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
