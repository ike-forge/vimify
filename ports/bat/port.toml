schema = 1
version = "0.1.0"
# Debian and Ubuntu ship the binary as batcat.
binaries = ["bat", "batcat"]
versions = ">=0.25"

notes = "Theme only: bat has no keybindings. Output longer than a screen pages through less, so its keys are less's. The less port rebinds them. Syntax colours follow the terminal's palette: bat ships no Catppuccin theme, and a custom one needs `bat cache --build`."

[[target]]
format = "lines"
strategy = "block"
paths = ["$BAT_CONFIG_PATH", "$XDG_CONFIG_HOME/bat/config"]
template = '--theme="ansi"'
