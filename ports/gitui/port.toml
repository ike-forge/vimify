schema = 1
version = "0.1.0"
binaries = ["gitui"]
versions = ">=0.28"
notes = "gitui binds one key per move, so the arrow keys stop moving. Help moves from h to ?, since h is left. delete is not mapped: gitui spreads discarding and deleting over several keys."

[[target]]
format = "ron"
strategy = "edit"
key_notation = "gitui"
paths = [
  "$XDG_CONFIG_HOME/gitui/key_bindings.ron",
  "~/Library/Application Support/gitui/key_bindings.ron",
]

[target.keys]
move_left = "left"
move_down = "down"
move_up = "up"
move_right = "right"
copy = "yank"
quit = "quit"

# gitui's help is on h, which left takes.
[target.theme]
open_help = "Some(( code: Char('?'), modifiers: \"\"))"

[[target]]
format = "ron"
strategy = "edit"
paths = [
  "$XDG_CONFIG_HOME/gitui/theme.ron",
  "~/Library/Application Support/gitui/theme.ron",
]

[target.theme]
selection_bg = 'Some("{selection}")'
selection_fg = 'Some("{text}")'
command_fg = 'Some("{text}")'
cmdbar_bg = 'Some("{surface}")'
disabled_fg = 'Some("{muted}")'
diff_line_add = 'Some("{success}")'
diff_line_delete = 'Some("{error}")'
diff_file_added = 'Some("{success}")'
diff_file_removed = 'Some("{error}")'
diff_file_modified = 'Some("{warning}")'
diff_file_moved = 'Some("{special}")'
danger_fg = 'Some("{error}")'
push_gauge_bg = 'Some("{accent}")'
push_gauge_fg = 'Some("{base}")'
branch_fg = 'Some("{accent}")'
