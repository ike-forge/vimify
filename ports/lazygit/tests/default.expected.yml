# Personal lazygit config
gui:
  # Needs a patched terminal font
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - '#8caaee'
      - bold
    lightTheme: false # dark terminal
    inactiveBorderColor:
      - '#a5adce'
    searchingActiveBorderColor:
      - '#e5c890'
    optionsTextColor:
      - '#8caaee'
    selectedLineBgColor:
      - '#414559'
    inactiveViewSelectedLineBgColor:
      - '#737994'
    cherryPickedCommitFgColor:
      - '#8caaee'
    cherryPickedCommitBgColor:
      - '#51576d'
    markedBaseCommitFgColor:
      - '#8caaee'
    markedBaseCommitBgColor:
      - '#e5c890'
    unstagedChangesColor:
      - '#e78284'
    defaultFgColor:
      - '#c6d0f5'
    authorColors:
      '*': '#babbf1'

git:
  paging:
    colorArg: always
    pager: delta --paging=never

keybinding:
  universal:
    quit: q
    nextItem: n
    nextBlock-alt: l
    nextItem-alt: j
    optionMenu: '?'
    prevBlock-alt: h
    prevItem-alt: k
    remove: d
    scrollDownMain-alt2: '<c-d>'
    scrollUpMain-alt2: '<c-u>'
    startSearch: /
  commits:
    copyCommitAttributeToClipboard: y
  files:
    copyFileInfoToClipboard: y
