# Personal lazygit config
gui:
  # Needs a patched terminal font
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - '#8caaee'
      - bold
    lightTheme: false # dark terminal
    defaultFgColor:
      - '#c6d0f5'
    inactiveBorderColor:
      - '#51576d'
    optionsTextColor:
      - '#8caaee'
    searchingActiveBorderColor:
      - '#e5c890'
      - bold
    selectedLineBgColor:
      - '#414559'
    unstagedChangesColor:
      - '#e78284'

git:
  paging:
    colorArg: always
    pager: delta --paging=never

keybinding:
  universal:
    quit: q
    nextItem: n
    nextBlock-alt: l
    nextItem-alt: j
    prevBlock-alt: h
    prevItem-alt: k
