schema = 1
version = "0.2.0"
binaries = ["lazygit"]
versions = ">=0.66"
notes = "yank covers the file and commit copy keys; delete covers the shared remove key. quit replaces q and ctrl+c: lazygit has one slot for it."

[[target]]
format = "yaml"
strategy = "edit"
key_notation = "angle"
paths = [
  "$LG_CONFIG_FILE",
  "$XDG_CONFIG_HOME/lazygit/config.yml",
  "~/Library/Application Support/lazygit/config.yml",
]

# The -alt slots: the primary ones hold the arrow keys, which must keep working.
[target.keys]
"keybinding.universal.prevItem-alt" = "up"
"keybinding.universal.nextItem-alt" = "down"
"keybinding.universal.prevBlock-alt" = "left"
"keybinding.universal.nextBlock-alt" = "right"
"keybinding.universal.remove" = "delete"
"keybinding.universal.quit" = "quit"
"keybinding.files.copyFileInfoToClipboard" = "yank"
"keybinding.commits.copyCommitAttributeToClipboard" = "yank"

[target.theme]
"gui.theme.activeBorderColor" = ["{accent}", "bold"]
"gui.theme.inactiveBorderColor" = ["{border}"]
"gui.theme.searchingActiveBorderColor" = ["{warning}", "bold"]
"gui.theme.optionsTextColor" = ["{accent}"]
"gui.theme.selectedLineBgColor" = ["{selection}"]
"gui.theme.unstagedChangesColor" = ["{error}"]
"gui.theme.defaultFgColor" = ["{text}"]
