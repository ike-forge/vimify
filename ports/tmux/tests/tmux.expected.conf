# Prefix on C-a.
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
set-option -g mouse on
# >>> vimify >>>
set-window-option -g mode-keys vi
set-window-option -g mode-style "bg=#414559,fg=#c6d0f5"
set-window-option -g window-status-current-style "bg=#8caaee,fg=#303446"
set-option -g status-style "bg=#292c3c,fg=#c6d0f5"
set-option -g message-style "bg=#292c3c,fg=#8caaee"
set-option -g pane-border-style "fg=#51576d"
set-option -g pane-active-border-style "fg=#8caaee"
bind-key -T copy-mode-vi '/' command-prompt -p "(search down)" "send-keys -X search-forward \"%%%\""
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi j send-keys -X cursor-down
bind-key -T copy-mode-vi h send-keys -X cursor-left
bind-key -T copy-mode-vi l send-keys -X cursor-right
bind-key -T copy-mode-vi k send-keys -X cursor-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi G send-keys -X history-bottom
bind-key -T copy-mode-vi g send-keys -X history-top
# <<< vimify <<<
