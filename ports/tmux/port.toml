schema = 1
version = "0.1.0"
binaries = ["tmux"]
version_args = ["-V"]
# send-keys -X, which the copy-mode bindings use, arrived in 2.4.
versions = ">=2.4"

notes = "Keys cover copy mode only: prefix bindings stay as they are. tmux's own copy-mode-vi keys keep working beside these. delete does not apply. help is not mapped: ? is search backward, as in vim. Lines after the vimify block override it. Takes effect in a new tmux server, or after `tmux source-file` on the config."

# Every tmux reads ~/.tmux.conf; the XDG path needs 3.1.
[[target]]
format = "lines"
strategy = "block"
key_notation = "tmux"
paths = ["~/.tmux.conf", "$XDG_CONFIG_HOME/tmux/tmux.conf"]
template = '''
set-window-option -g mode-keys vi
set-window-option -g mode-style "bg={selection},fg={text}"
set-window-option -g window-status-current-style "bg={accent},fg={base}"
set-option -g status-style "bg={surface},fg={text}"
set-option -g message-style "bg={surface},fg={accent}"
set-option -g pane-border-style "fg={border}"
set-option -g pane-active-border-style "fg={accent}"'''
key_line = "bind-key -T copy-mode-vi {key} {setting}"

[target.keys]
"send-keys -X cursor-left" = "left"
"send-keys -X cursor-down" = "down"
"send-keys -X cursor-up" = "up"
"send-keys -X cursor-right" = "right"
"send-keys -X copy-selection-and-cancel" = "yank"
"send-keys -X cancel" = "quit"
"send-keys -X history-top" = "top"
"send-keys -X history-bottom" = "bottom"
"send-keys -X halfpage-up" = "page_up"
"send-keys -X halfpage-down" = "page_down"
'command-prompt -p "(search down)" "send-keys -X search-forward \"%%%\""' = "search"
