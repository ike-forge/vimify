schema = 1
version = "0.1.0"
binaries = ["lfk"]
versions = ">=0.19"

notes = "Theme only: lfk's navigation is fixed, and vimify leaves resource deletion on D."

[[target]]
format = "yaml"
strategy = "edit"
paths = ["$LFK_CONFIG_DIR/config.yaml", "$XDG_CONFIG_HOME/lfk/config.yaml"]

[target.theme]
"theme.primary" = "{accent}"
"theme.secondary" = "{success}"
"theme.text" = "{text}"
"theme.selected_fg" = "{base}"
"theme.selected_bg" = "{accent}"
"theme.border" = "{border}"
"theme.dimmed" = "{muted}"
"theme.error" = "{error}"
"theme.warning" = "{warning}"
"theme.purple" = "{special}"
"theme.base" = "{base}"
"theme.bar_bg" = "{selection}"
"theme.surface" = "{surface}"
