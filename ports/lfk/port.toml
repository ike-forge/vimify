schema = 1
version = "0.4.0"
binaries = ["lfk"]
versions = ">=0.19"

notes = "quit, top, bottom and paging stay on q, g, G, ctrl+u and ctrl+d: lfk hardcodes them. Catppuccin is lfk's own colorscheme; other themes write the palette as theme overrides. help takes the keymaps panel, ? by default. Diff moves from d to D, which delete frees."

[[target]]
format = "yaml"
strategy = "edit"
key_notation = "plus"
paths = ["$LFK_CONFIG_DIR/config.yaml", "$XDG_CONFIG_HOME/lfk/config.yaml"]

# lfk keeps the arrow keys bound next to these.
[target.keys]
"keybindings.left" = "left"
"keybindings.down" = "down"
"keybindings.up" = "up"
"keybindings.right" = "right"
"keybindings.copy_name" = "yank"
"keybindings.delete" = "delete"
"keybindings.search" = "search"
"keybindings.which_key_leader" = "help"

[target.theme]
# Diff defaults to d, the default delete key.
"keybindings.diff" = "D"
"theme.primary" = "{accent}"
"theme.secondary" = "{success}"
"theme.text" = "{text}"
"theme.selected_fg" = "{base}"
"theme.selected_bg" = "{accent}"
"theme.border" = "{border}"
"theme.dimmed" = "{muted}"
"theme.error" = "{error}"
"theme.warning" = "{warning}"
"theme.purple" = "{special}"
"theme.base" = "{base}"
"theme.bar_bg" = "{selection}"
"theme.surface" = "{surface}"

[target.builtin.catppuccin-latte]
"appearance.colorscheme" = "catppuccin-latte"
"keybindings.diff" = "D"

[target.builtin.catppuccin-frappe]
"appearance.colorscheme" = "catppuccin-frappe"
"keybindings.diff" = "D"

[target.builtin.catppuccin-macchiato]
"appearance.colorscheme" = "catppuccin-macchiato"
"keybindings.diff" = "D"

[target.builtin.catppuccin-mocha]
"appearance.colorscheme" = "catppuccin-mocha"
"keybindings.diff" = "D"
