# The bundle lives on its own branch: committing it to master would conflict on every
# port PR.
name: Publish ports

on:
  push:
    branches: [master]
    paths: [ports/**, src/port.rs, src/registry.rs]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --example port_bundle > "$RUNNER_TEMP/ports.toml"
      - name: Push to ports-bundle
        run: |
          git fetch origin ports-bundle || true
          git switch --orphan ports-bundle-next
          cp "$RUNNER_TEMP/ports.toml" ports.toml
          git add ports.toml
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "Publish ports from $GITHUB_SHA"
          git push --force origin ports-bundle-next:ports-bundle
